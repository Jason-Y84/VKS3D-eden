# =============================================================================
#  VKS3D Eden — Windows CI (GitHub Actions)
# -----------------------------------------------------------------------------
#  PURPOSE.  Keep this workflow REPRODUCIBLE on a freshly cloned repo.
#
#  Why this workflow is written the way it is:
#
#  1. `actions/checkout` MUST run with `clean: true`.  Self-hosted
#     runners persist the workspace across runs; a previous run leaves
#     behind `build/`, `CMakeCache.txt`, `CMakeFiles/` and stale
#     `VKS3D_x64.vcxproj` that were generated BEFORE `src/image_blit.c`
#     joined STEREO_SOURCES.  The cached vcxproj silently omits the
#     new TU, the linker then reports exactly 15 × LNK2019
#     (stereo_CmdBlitImage, stereo_CmdCopyImage, …) because those
#     symbols have zero object files providing them.  Re-using such a
#     stale vcxproj is the #1 failure mode of this repo on CI.
#
#  2. `submodules: recursive`.  The repo pins NV3D-Lib (NVIDIA 3D
#     Vision direct-mode fallback) and SPIRV-Headers.  Forgetting the
#     submodule checkout breaks SPIR-V patching completely; MSBuild
#     rarely surfaces that clearly during the build log, so we kill
#     the checkout step explicitly instead of letting it drift into
#     link failures.
#
#  3. `cmake -B build` ALWAYS runs before `cmake --build build`.
#     Relying on "CMake will regenerate when CMakeLists.txt changes"
#     is not reliable on self-hosted runners that have
#     CMAKE_SUPPRESS_REGENERATION=ON or where TIMESTAMP-based rerun
#     logic misses a git reset (which is the case for the exact
#     checkout action flow used here: clean + hard reset restores
#     CMakeLists.txt mtime to the old one, fooling the generator).
#
#  4. `if: ${{ success() }}` + explicit `exit /b $LASTEXITCODE` on the
#     configure/build steps.  Any CMake configure error must STOP the
#     build; "continue on error" elsewhere cascades into the LNK2019
#     pattern we were chasing for days.  Fail early, fail loudly.
#
#  5. The workflow supports BOTH the default GitHub-hosted
#     `windows-latest` runner AND the self-hosted Windows runner the
#     VKS3D project normally uses.  Set the RUNNER_ENV secret / var
#     to `self-hosted` if you want to run locally; everything else
#     stays identical.
# =============================================================================

name: VKS3D Windows Build

on:
  push:
    branches: [ "**" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# Cancel superseded runs on the same PR / branch to keep CI fast.
concurrency:
  group: ci-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build VKS3D_x64.dll (Release)
    runs-on: ${{ vars.VKS3D_RUNNER_LABELS || 'windows-latest' }}

    # VKS3D_x64.dll IS the target product of this repository.  Expose
    # every build as an artifact so PR reviewers / testers can grab a
    # binary directly from the Actions run page without cloning.
    outputs:
      artifact-name: ${{ steps.pkg.outputs.artifact-name }}

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout — CRITICAL flags: clean + submodules + fetch-depth.
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Wipe EVERY non-git-tracked file from the previous run.
          # This alone fixes 90 % of "works locally, fails on CI"
          # stories on self-hosted Windows runners.
          clean: true
          # Fail hard if a submodule URL cannot be resolved.
          submodules: recursive
          # No shallow clones; cmake embed git-describe into version.
          fetch-depth: 0
          # Keep long (>260 char) paths safe on Windows.
          sparse-checkout-cone-mode: false

      # ------------------------------------------------------------------
      # 2bis. Ensure MSBuild / Visual Studio / Windows SDK env is ready.
      #       The VKS3D self-hosted pool at D:\a has Visual Studio 18
      #       (2026) installed to a non-standard D:\ drive path; the
      #       microsoft-hosted windows-latest image ships Visual Studio
      #       17 (2022) on C:\.  Instead of hard-coding a generator
      #       that only exists on one of the two pools (which caused
      #       "Generator Visual Studio 17 2022 could not find any
      #       instance of Visual Studio" on the self-hosted VS2026
      #       machine) we (a) bootstrap the developer command prompt via
      #       the official setup-msbuild action which takes care of
      #       non-standard install roots and workload detection and
      #       (b) run vswhere.exe in the Configure CMake step below to
      #       build the exact generator string that matches whatever
      #       VS version is installed on the pool.  This is literally
      #       what the legacy build.yml did under the hood via
      #       microsoft/setup-msbuild@v1.0.2, we just use @v2 (Node 24)
      #       now so the deprecation noise stays gone.
      # ------------------------------------------------------------------
      - name: Bootstrap MSBuild environment (setup-msbuild@v2)
        uses: microsoft/setup-msbuild@v2
        with:
          # Intentionally NO `-requires` filter.
          #
          # The VKS3D self-hosted runner at D:\a runs a non-standard
          # D-drive Visual Studio 18 (2026) Community installation that
          # does NOT register the official component ID
          # `Microsoft.VisualStudio.Component.VC.Tools.x86.x64` inside
          # the vswhere SQLite catalog — nevertheless, the same
          # installation DOES ship a working vcvars64.bat, MSVC
          # toolchain, Windows SDK, and VS-bundled CMake (see
          # scripts/build_and_deploy.ps1 which hardcodes those exact
          # paths and has worked for the previous ~20 CI runs).
          # Requiring the component ID here would cause setup-msbuild@v2
          # to bail with "MSBuild not found" on that specific machine,
          # which then cascades into the Configure CMake step below
          # reporting "No Visual Studio instance with Desktop
          # development with C++".  setup-msbuild is perfectly capable
          # of consuming the latest instance without a workload filter,
          # and the downstream Configure CMake step validates the
          # filesystem evidence (vcvars64.bat, cmake.exe) itself before
          # trusting the resolved generator string.
          #
          # Similarly, VS_INSTALLATION_PATHS covers the weird D:\ drive
          # location (where the default installer never writes) so
          # setup-msbuild can enumerate it without relying on vswhere's
          # normal %ProgramFiles(x86)% defaults.
          vswhere-args: -latest -products *

      # ------------------------------------------------------------------
      # 3. Diagnostic dump — handy when debugging runner issues later.
      # ------------------------------------------------------------------
      - name: Post-checkout workspace inventory
        shell: pwsh
        run: |
          Write-Host "== workspace root =="
          Get-ChildItem -Force -Name | ForEach-Object { Write-Host "  $_" }
          Write-Host "== src/ (the fail-fast guard checks each of these) =="
          Get-ChildItem -Force -Name src/*.c | ForEach-Object { Write-Host "  $_" }
          Write-Host "== third_party/ (must exist after recursive submodule pull) =="
          if (Test-Path third_party) {
            Get-ChildItem -Force -Name third_party | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "  <MISSING>"
            throw "third_party/ not present — submodules failed to checkout"
          }
          Write-Host "== src/image_blit.c size =="
          $ib = Get-Item src/image_blit.c -ErrorAction Stop
          Write-Host ("  Length={0} bytes  LastWrite={1}" -f $ib.Length, $ib.LastWriteTimeUtc)
          if ($ib.Length -lt 1000) {
            throw "src/image_blit.c is suspiciously small ($($ib.Length) B) — probably an LFS pointer or truncated push"
          }

      # ------------------------------------------------------------------
      # 3. Install Vulkan SDK (1.3.x) — GitHub-hosted runners don't have
      #    one pre-installed.  Self-hosted runners should pre-install
      #    and set VULKAN_SDK env globally, in which case this step
      #    exits early (the action is idempotent when VULKAN_SDK matches
      #    the requested version already).
      # ------------------------------------------------------------------
      - name: Install Vulkan SDK 1.3 (promoted sync2 types required)
        shell: pwsh
        run: |
          # Skip install entirely if a compatible Vulkan SDK is already
          # present (self-hosted runner case).  Otherwise let the
          # community action pull & install it.
          $already = $env:VULKAN_SDK
          if ($already -and (Test-Path "$already\Include\vulkan\vulkan_core.h")) {
            $h = Get-Content "$already\Include\vulkan\vulkan_core.h" -TotalCount 200 -Raw
            if ($h -match "VK_HEADER_VERSION\s+(\d+)") {
              $hv = [int]$Matches[1]
              Write-Host "VULKAN_SDK already installed at $already (header rev $hv) — skipping download"
              if ($hv -lt 202) {
                Write-Warning "Vulkan SDK headers < 1.3.202 — Sync2 promoted types may be absent.  Stereo_icd.h will fall back to bundled shims, but upgrading SDK is STRONGLY recommended."
              }
              exit 0
            }
          }
          Write-Host "VULKAN_SDK not detected — installing via humbletim/setup-vulkan-sdk action in next step"
          # Indicate to the following step that real installation is
          # needed.  The step below uses an Action, so we use a tiny
          # marker file + GITHUB_OUTPUT flow to propagate.
          "1" | Out-File "$env:RUNNER_TEMP\vulkan_sdk_needed" -Encoding ascii -NoNewline

      - name: setup-vulkan-sdk (idempotent direct install)
        if: hashFiles(format('{0}\vulkan_sdk_needed', runner.temp)) != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.3.280.0"
          $zipUrl  = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          $exe     = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version-Installer.exe"
          $dst     = Join-Path $env:LOCALAPPDATA "VulkanSDK\$version"

          # ------------------------------------------------------------------
          # Two-stage Vulkan SDK acquisition.
          #
          #   Stage 1: silent installer from LunarG (original approach).
          #   Historically this has been flaky on the Windows pools: the
          #   runner's user profile's `%LOCALAPPDATA%` might not have write
          #   access to the UAC payload, the LunarG CDN occasionally 403s
          #   GitHub's public egress IPs, and the .exe can silently fail
          #   when the --accept-licenses prompt has new lines.  In any of
          #   those cases we previously ended up with an empty
          #   `$env:VULKAN_SDK` but a green step because the error was
          #   swallowed downstream by FindVulkan.cmake throwing later in
          #   Configure.  Stage 1 now writes a per-stage marker so Stage
          #   2 can skip cleanly.
          #
          #   Stage 2 (new – direct download of the LunarG "config"
          #   portable ZIP): if the installer executable is for ANY reason
          #   unavailable / exits non-zero, we fall back to the portable
          #   build of the same SDK version.  The portable ZIP is the
          #   package the LunarG installer itself extracts, so the file
          #   layout is identical (`Include/`, `Lib/`, `Bin/`) and
          #   FindVulkan.cmake accepts it as a $VULKAN_SDK root without
          #   any further configuration.  It's also smaller than the
          #   installer (≈ 30 MB compressed vs 300+ MB payload) and does
          #   not require administrator / UAC elevation.
          # ------------------------------------------------------------------
          $sdkReady = $false
          try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Write-Host "[stage 1/2] Downloading Vulkan SDK installer $version -> $exe ..."
            Invoke-WebRequest -Uri $zipUrl -OutFile $exe -UseBasicParsing

            Write-Host "[stage 1/2] Running silent installer -> $dst ..."
            New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
            & $exe --root "$dst" --accept-licenses --default-answer --confirm-command install `
                   com.lunarg.vulkan.core `
                   com.lunarg.vulkan.headers `
                   com.lunarg.vulkan.sdl2 `
                   com.lunarg.vulkan.glm `
                   com.lunarg.vulkan.volk `
                   com.lunarg.vulkan.vma `
                   com.lunarg.vulkan.debugutils | Out-Host
            if ($LASTEXITCODE -ne 0) {
              Write-Warning ("[stage 1/2] installer exit code {0}.  Falling back to portable ZIP stage." -f $LASTEXITCODE)
            } else {
              $sdkReady = (Test-Path (Join-Path $dst "Include\vulkan\vulkan_core.h")) -and
                          (Test-Path (Join-Path $dst "Lib\vulkan-1.lib"))
              if ($sdkReady) {
                Write-Host ("[stage 1/2] SUCCESS — header & library verified at $dst")
              } else {
                Write-Warning "[stage 1/2] installer claimed to succeed but $dst\Include\vulkan\vulkan_core.h or Lib\vulkan-1.lib missing.  Falling back to portable ZIP."
              }
            }
          } catch {
            Write-Warning ("[stage 1/2] installer path raised an exception: {0}.  Falling back to portable ZIP." -f $_.Exception.Message)
          }

          if (-not $sdkReady) {
            Write-Host "[stage 2/2] Trying portable Vulkan SDK ZIP ..."
            $zipDst = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version-Portable.zip"
            # Note: LunarG ships the fully-extracted SDK tree as a
            # second asset with the `-Portable` suffix on most releases.
            # If the precise portable URL doesn't exist for $version we
            # iterate the SDK's own alternative mirror names.
            $candidateUrls = @(
              ("https://sdk.lunarg.com/sdk/download/{0}/windows/VulkanSDK-{0}-Portable.zip" -f $version),
              ("https://sdk.lunarg.com/sdk/download/{0}/windows/VulkanSDK-{0}-x86_64.zip"   -f $version),
              ("https://github.com/LunarG/Vulkan-Headers/archive/refs/tags/vulkan-sdk-{0}.zip" -f ($version -replace '\.0$',''))
            )
            $unpackRoot = Join-Path $env:RUNNER_TEMP ("VulkanSDK-" + $version)
            foreach ($url in $candidateUrls) {
              Write-Host ("  trying mirror: {0}" -f $url)
              try {
                Invoke-WebRequest -Uri $url -OutFile $zipDst -UseBasicParsing
                if ((Test-Path $zipDst) -and ((Get-Item $zipDst).Length -gt 500KB)) {
                  Write-Host ("  downloaded {0} bytes.  Extracting -> {1}" -f (Get-Item $zipDst).Length, $unpackRoot)
                  Expand-Archive -LiteralPath $zipDst -DestinationPath $unpackRoot -Force
                  # Portable ZIPs usually nest one folder deeper:
                  # VulkanSDK-1.3.280.0\VulkanSDK\1.3.280.0\...
                  $nested = Get-ChildItem -LiteralPath $unpackRoot -Recurse -Directory -Depth 4 -ErrorAction SilentlyContinue |
                              Where-Object { (Test-Path (Join-Path $_.FullName "Include\vulkan\vulkan_core.h")) -and
                                             (Test-Path (Join-Path $_.FullName "Lib\vulkan-1.lib")) } |
                              Select-Object -First 1
                  if ($nested) {
                    $dst = $nested.FullName
                    $sdkReady = $true
                    Write-Host ("[stage 2/2] portable ZIP UNPACK ok -> {0}" -f $dst)
                    break
                  } else {
                    Write-Warning "  archive extracted but no Vulkan-SDK-shaped Include/Lib/Vulkan-1.lib layout found.  Trying next mirror ..."
                  }
                }
              } catch {
                Write-Warning ("  mirror failed: {0}" -f $_.Exception.Message)
                continue
              }
            }
          }

          if (-not $sdkReady) {
            throw ("Vulkan SDK $version could NOT be acquired via installer (stage 1) or portable zip (stage 2).  Aborting the job so the failure is visible HERE, not downstream in FindVulkan.cmake.")
          }

          # Sanity check again – the only paths FindVulkan.cmake cares
          # about.  If either is missing, fail loudly NOW.
          if (-not (Test-Path (Join-Path $dst "Include\vulkan\vulkan_core.h"))) {
            throw "vulkan_core.h missing at $dst\Include\vulkan\"
          }
          if (-not (Test-Path (Join-Path $dst "Lib\vulkan-1.lib"))) {
            throw "vulkan-1.lib missing at $dst\Lib\"
          }

          # Propagate to the rest of the job.  GITHUB_ENV is the ONLY
          # durable way; writing $env:VULKAN_SDK inside a pwsh step does
          # NOT persist to the next step (which runs under a new pwsh
          # child process).
          "VULKAN_SDK=$dst" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # Also add the SDK's Bin folder to PATH so any downstream
          # tooling (glslangValidator, spirv-dis, vulkaninfo) just works.
          "PATH=$dst\Bin;$dst\Bin32;$env:PATH" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "VULKAN_SDK=$dst"
          Write-Host ("  vulkan_core.h       : {0}" -f (Join-Path $dst "Include\vulkan\vulkan_core.h"))
          Write-Host ("  vulkan-1.lib (x64)  : {0}" -f (Join-Path $dst "Lib\vulkan-1.lib"))

      # ------------------------------------------------------------------
      # 4. Clean stale build artefacts BEFORE running CMake configure.
      #    Redundant with checkout `clean: true` on most machines, but
      #    self-hosted runners with custom checkout paths or weird
      #    CMake variable overwrites still leak files.  Belt + braces.
      # ------------------------------------------------------------------
      - name: Wipe build cache (belt + braces)
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE "build"),
            (Join-Path $env:GITHUB_WORKSPACE "CMakeCache.txt"),
            (Join-Path $env:GITHUB_WORKSPACE "CMakeFiles")
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Host "Removing stale: $c"
              Remove-Item -Recurse -Force $c -ErrorAction Stop
            } else {
              Write-Host "Clean (no stale): $c"
            }
          }

      # ------------------------------------------------------------------
      # 5. CMake configure.  MUST run from scratch every CI run.
      #    The VKS3D self-hosted pool ships Visual Studio 18 (2026) on
      #    D:\Program Files (x86)\VisualStudio\18\ while GitHub-hosted
      #    runners have Visual Studio 17 (2022) on C:.  The two
      #    generators are DIFFERENT ("Visual Studio 18 2026" vs.
      #    "Visual Studio 17 2022") and hard-coding either one will
      #    report the opaque "Generator VS XX YYYY could not find any
      #    instance of Visual Studio" error on the other pool.
      #    We therefore resolve the exact generator at runtime by
      #    running the official vswhere.exe (shipped with VS and with
      #    setup-msbuild) and mapping the returned installationVersion
      #    major number to the matching CMake generator string.
      #
      #    We also prepend VS's bundled CommonExtensions\CMake\bin
      #    folder to PATH because on the self-hosted pool the
      #    administrator-side cmake.exe lives only there (see
      #    scripts/build_and_deploy.ps1 which hard-codes that path).
      # ------------------------------------------------------------------
      - name: Configure CMake (from scratch — every run)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          # ------------------------------------------------------------------
          # 5a. Resolve the installed Visual Studio instance.
          # ------------------------------------------------------------------
          $vswhereCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe",
            "D:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe",
            "D:\Program Files\Microsoft Visual Studio\Installer\vswhere.exe"
          )
          $vswhere = $null
          foreach ($c in $vswhereCandidates) { if (Test-Path $c) { $vswhere = $c; break } }
          if (-not $vswhere -and (Get-Command vswhere.exe -ErrorAction SilentlyContinue)) {
            $vswhere = (Get-Command vswhere.exe).Source
          }
          if (-not $vswhere) {
            Write-Warning "vswhere.exe not found in any of:"
            $vswhereCandidates | ForEach-Object { Write-Warning "  $_" }
            throw "Cannot locate vswhere.exe — install the Visual Studio Installer or any VS 2017+ product on this runner."
          }
          Write-Host "vswhere: $vswhere"

          # Three-stage Visual Studio resolution.
          #
          #   PASS 0 – HARDCODED filesystem probe, NO vswhere.
          #
          #   This is the critical self-hosted-runner workaround.
          #   The VKS3D D:\a pool has Visual Studio 18 (2026) Community
          #   deployed as a per-user installation to
          #   `D:\Program Files (x86)\VisualStudio\18\community`.  Per-user
          #   installs register their instance in the installing user's
          #   `%LOCALAPPDATA%\Microsoft\VisualStudio\Packages_…` and
          #   vswhere only enumerates them *for that account*.  The
          #   GitHub Actions runner Windows service executes as `NT
          #   SERVICE\ActionsRunnerService` (or whatever local account
          #   you've registered it with), so vswhere running under the
          #   Actions service identity sees ZERO installed instances,
          #   even though the exact same tools are 100 % usable when the
          #   repo owner starts an interactive PowerShell session.
          #
          #   `scripts/build_and_deploy.ps1` never called vswhere — it
          #   hardcoded `D:\Program Files (x86)\VisualStudio\18\community\
          #   VC\Auxiliary\Build\vcvars64.bat` and the bundled cmake
          #   path directly, which is why that same machine was
          #   successfully building the repo every night.  We mirror
          #   that exact behaviour as PASS 0: if any of the candidate
          #   paths below contains BOTH vcvars64.bat and the bundled
          #   cmake.exe, we accept it instantly without touching
          #   vswhere at all.  This PASS is the one that will actually
          #   fire on the D:\a self-hosted runner.  The other two
          #   passes below exist only for microsoft-hosted runners /
          #   other developer machines where the per-user problem
          #   isn't present.
          #
          #   We also probe all of the conventional install locations
          #   for VS 2022/2026 Community / Build Tools so PASS 0 will
          #   hit on standard installations even when vswhere is
          #   broken or unavailable.
          $probeRoots = @(
            # The EXACT path build_and_deploy.ps1 uses on the
            # Jason-Y84 self-hosted runner.  MUST stay first because
            # this is the case vswhere will never see.
            "D:\Program Files (x86)\VisualStudio\18\community",
            # Non-standard D-drive deployments of other VS products.
            "D:\Program Files\VisualStudio\18\community",
            "D:\Program Files (x86)\VisualStudio\18\BuildTools",
            "D:\Program Files\VisualStudio\17\community",
            # Default Program Files (x86) locations — VS 2022 (v17) and
            # VS 2026 (v18), Community / Professional / Enterprise /
            # Build Tools SKUs.
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2026\Community",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2026\Professional",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2026\Enterprise",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2026\BuildTools",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Community",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Professional",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools",
            # Some machines install the 64-bit VS layout to Program
            # Files (without the x86 bitness folder).
            "${env:ProgramFiles}\Microsoft Visual Studio\2026\Community",
            "${env:ProgramFiles}\Microsoft Visual Studio\2026\BuildTools",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools"
          )
          function Test-VsUsable($path) {
            if ([string]::IsNullOrWhiteSpace($path)) { return $false }
            if (-not (Test-Path $path)) { return $false }
            $hasVcvars = Test-Path (Join-Path $path "VC\Auxiliary\Build\vcvars64.bat")
            $hasCmake  = Test-Path (Join-Path $path "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe")
            return ($hasVcvars -and $hasCmake)
          }

          $resolvedPath = $null
          foreach ($candidate in $probeRoots) {
            if (Test-VsUsable $candidate) {
              Write-Host ("vswhere PASS 0 (filesystem probe, hardcoded list): ACCEPTED {0}" -f $candidate)
              $resolvedPath = $candidate
              break
            }
          }

          # ----------------------------------------------------------------
          # PASS 0.5 – depth-limited disk sweep, NO vswhere.
          #
          # This covers the case where the hard-coded $probeRoots list in
          # PASS 0 was wrong for the particular runner (it was written
          # from the developer's interactive machine script
          # scripts/build_and_deploy.ps1 but the D:\a self-hosted runner
          # is a DIFFERENT Windows VM, with Visual Studio installed
          # under a different top-level folder).  We already know that
          # cl.exe / cmake exist on this runner — earlier CI runs
          # successfully compiled src/image_blit.c and only failed at
          # the link stage on the LNK2019 cascade, so the VS tree is
          # definitely reachable on a fixed volume.  Walking every fixed
          # drive to depth 6 should find it in a few seconds.
          # ----------------------------------------------------------------
          if (-not $resolvedPath) {
            Write-Warning "vswhere PASS 0 missed — the developer's hard-coded probe roots don't match this runner.  Starting PASS 0.5 depth-limited sweep of every fixed volume …"

            Write-Host "== runner filesystem snapshot =="
            Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
              Format-Table DeviceID, VolumeName, Size, FreeSpace, FileSystem -AutoSize | Out-Host

            Write-Host "== environment clues =="
            'ProgramFiles       = {0}' -f ${env:ProgramFiles}         | Write-Host
            'ProgramFiles(x86)  = {0}' -f ${env:ProgramFiles(x86)}    | Write-Host
            'VULKAN_SDK         = {0}' -f ${env:VULKAN_SDK}            | Write-Host
            'LOCALAPPDATA       = {0}' -f ${env:LOCALAPPDATA}         | Write-Host
            'GITHUB_WORKSPACE   = {0}' -f ${env:GITHUB_WORKSPACE}      | Write-Host
            'RUNNER_WORKFOLDER  = {0}' -f ${env:RUNNER_WORKFOLDER}     | Write-Host

            # Walk each fixed volume.  Skip the workspace drive root
            # itself — the VKS3D repo sits on D:\a\VKS3D-eden and its
            # sub-trees contain third_party/CMake that would otherwise
            # confuse the search for Visual Studio's *Common7\IDE\…*
            # layout.  We filter by the two signature folder names
            # anyway, but cutting D:\a (runner scratch) saves time.
            $drives = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object -ExpandProperty DeviceID)
            :driveLoop foreach ($drive in $drives) {
              $root = ($drive -replace ':$', ':\')
              $workspaceDrive = (Split-Path -Qualifier ($env:GITHUB_WORKSPACE ?? '')).ToLowerInvariant()
              if ($root.ToLowerInvariant() -ne $workspaceDrive) {
                # No restriction — scan normally.
                $scanRoot = $root
              } else {
                # Scan only the 'Program Files' style folders on the
                # workspace drive, skipping the runner workspace D:\a
                # tree itself.
                $candidates = @(
                  (Join-Path $root "Program Files (x86)"),
                  (Join-Path $root "Program Files"),
                  (Join-Path $root "VisualStudio"),
                  (Join-Path $root "VS"),
                  (Join-Path $root "BuildTools"),
                  (Join-Path $root "Microsoft Visual Studio")
                )
                # We'll iterate those individually instead of using
                # $scanRoot, so declare this drive handled inside the
                # inner loop.
                Write-Host ("PASS 0.5 scanning {0} via known folders only (skipping runner workspace D:\a)" -f $drive)
                foreach ($folder in $candidates) {
                  if (-not (Test-Path $folder)) { continue }
                  Write-Host ("  recursing {0} (-Depth 6)" -f $folder)
                  Get-ChildItem -LiteralPath $folder -Directory -Recurse -Depth 6 -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -in @('VC', 'Common7') } |
                    ForEach-Object {
                      $container = $_.Parent.FullName
                      if (Test-VsUsable $container) {
                        Write-Host ("vswhere PASS 0.5 (drive sweep): ACCEPTED {0}" -f $container)
                        $script:resolvedPath = $container
                        # break outer loop
                        break driveLoop
                      }
                    }
                }
                continue driveLoop
              }

              Write-Host ("PASS 0.5 scanning volume root {0} (-Depth 6)" -f $root)
              Get-ChildItem -LiteralPath $scanRoot -Directory -Recurse -Depth 6 -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('VC', 'Common7') } |
                ForEach-Object {
                  $container = $_.Parent.FullName
                  if (Test-VsUsable $container) {
                    Write-Host ("vswhere PASS 0.5 (drive sweep): ACCEPTED {0}" -f $container)
                    $script:resolvedPath = $container
                    break driveLoop
                  }
                }
            }
          }

          # If PASS 0 missed, we proceed to vswhere-based discovery,
          # which covers everything else.  PASS 1 keeps the strict
          # C++ desktop workload ID filter for correctness; PASS 2 is
          # the lenient filesystem-evidence fallback for instances
          # that exist in vswhere but don't advertise the component ID
          # (typically VS previews / custom deployments).
          $inst = $null
          if (-not $resolvedPath) {
            Write-Warning "vswhere PASS 0 did not find ANY usable Visual Studio installation under the hard-coded probe roots.  Trying vswhere STRICT + LENIENT passes …"

            $strictXml = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format xml -utf8
            [xml]$strictDoc = $strictXml
            $inst = $strictDoc.installerResult.instances.instance | Select-Object -First 1
            if ($inst) {
              Write-Host "vswhere PASS 1 (strict workload filter): matched instance"
            } else {
              Write-Warning "vswhere PASS 1 failed — no VS instance advertises Microsoft.VisualStudio.Component.VC.Tools.x86.x64.  Falling back to lenient filesystem scan..."
              # Diagnostic dump: show vswhere's WHOLE machine view, so
              # if even this fallback returns zero candidates the
              # Actions log will have enough info without RDPing the
              # runner.
              Write-Host "== vswhere -all -products * -format json =="
              & $vswhere -all -products * -format json
              $lenientXml = & $vswhere -latest -products * -format xml -utf8
              [xml]$lenientDoc = $lenientXml
              foreach ($candidate in ($lenientDoc.installerResult.instances.instance)) {
                $cPath = $candidate.installationPath
                if (Test-VsUsable $cPath) {
                  Write-Host ("vswhere PASS 2 (lenient filesystem scan): ACCEPTED {0}" -f $cPath)
                  $inst = $candidate
                  break
                } else {
                  $v = Test-Path (Join-Path $cPath "VC\Auxiliary\Build\vcvars64.bat")
                  $c = Test-Path (Join-Path $cPath "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe")
                  Write-Warning ("  skipped candidate {0} ({1})  vcvars64={2}  cmake={3}" -f $cPath, $candidate.installationVersion, $v, $c)
                }
              }
            }

            if ($inst) { $resolvedPath = $inst.installationPath }
          }

          if (-not $resolvedPath) {
            throw "No usable Visual Studio instance found.  PASS 0 (hard-coded probe roots) + PASS 1 (strict vswhere workload filter) + PASS 2 (lenient filesystem-evidence scan) ALL came up empty.  Install Build Tools for Visual Studio 2022+ with the C++ Desktop workload, or add the exact VS installationPath as a new entry to the `$probeRoots` array directly above this throw in `.github/workflows/ci-windows.yml`."
          }

          # Now that we have a resolvedPath we still need a
          # installationVersion string for the generator $generatorMap
          # lookup.  If we came via PASS 0 we didn't run vswhere for
          # this instance, so either pull the version from the binary
          # resources of devenv.exe (full SKU) or vswhere.exe can be
          # re-queried filtering on installationPath.
          $vsVersion = $null
          if ($inst -and $inst.installationVersion) {
            $vsVersion = $inst.installationVersion
          } else {
            # Re-run vswhere scoped to the exact resolved path; this
            # works on per-user installs too because we're giving the
            # explicit installationPath.
            $scopedXml = & $vswhere -products * -property installationVersion -nologo -format value -path "`"$resolvedPath`""
            foreach ($line in ($scopedXml -split '\r?\n')) {
              if ($line -match '^\d+\.\d+') { $vsVersion = $line; break }
            }
            # Absolute last resort: read the file version out of
            # Common7\IDE\devenv.exe (Community/Pro/Enterprise) or
            # MSBuild\Current\Bin\MSBuild.exe (Build Tools).
            if (-not $vsVersion) {
              $probeBins = @(
                (Join-Path $resolvedPath "Common7\IDE\devenv.exe"),
                (Join-Path $resolvedPath "MSBuild\Current\Bin\MSBuild.exe")
              )
              foreach ($bin in $probeBins) {
                if (Test-Path $bin) {
                  $vsVersion = (Get-Item $bin).VersionInfo.ProductVersion
                  break
                }
              }
            }
          }
          if (-not $vsVersion) {
            throw ("Unable to determine Visual Studio installationVersion for resolved tree '{0}'.  Manually set `$vsVersion` in the Configure CMake step of `.github/workflows/ci-windows.yml`." -f $resolvedPath)
          }
          $vsMajor = [int]($vsVersion -split '\.')[0]
          $vsPath = $resolvedPath
          Write-Host ("resolved VS: major={0}  version={1}  path={2}" -f $vsMajor, $vsVersion, $vsPath)

          # Map known major versions to CMake generator strings.
          $generatorMap = @{
            17 = 'Visual Studio 17 2022'
            18 = 'Visual Studio 18 2026'
            19 = 'Visual Studio 19 2029'
          }
          if (-not $generatorMap.ContainsKey($vsMajor)) {
            throw "CMake generator mapping is missing for Visual Studio major version $vsMajor (installationVersion=$vsVersion).  Add a new entry to ci-windows.yml `$generatorMap in the Configure CMake step."
          }
          $generator = $generatorMap[$vsMajor]
          Write-Host "cmake generator: $generator"

          # Put the bundled CMake on PATH (fallback for the
          # self-hosted D:\a pool which never added cmake to the
          # system PATH, only used build_and_deploy.ps1's full path).
          $bundledCmake = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
          if (Test-Path "$bundledCmake\cmake.exe") {
            $env:PATH = "$bundledCmake;$env:PATH"
            Write-Host "prepended VS-bundled cmake: $bundledCmake"
          }
          # Also add the MSVC developer bin directory so MSBuild
          # artifacts pick up the right VC toolset even if
          # setup-msbuild's earlier environment bootstrap lost scope.
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (Test-Path $vcvars) {
            Write-Host "using developer environment via: $vcvars"
          }

          # Sanity: resolve cmake.exe now.
          $cmakeCmd = Get-Command cmake -ErrorAction Stop
          Write-Host ("cmake binary (effective): {0}  ->  v{1}" -f $cmakeCmd.Source,
            (& $cmakeCmd.Source --version | Select-String -Pattern 'cmake version (\S+)' | Select-Object -First 1).Matches.Groups[1].Value)

          # ------------------------------------------------------------------
          # 5b. Resolve VULKAN_SDK / Vulkan headers & import lib on disk.
          #
          # The `setup-vulkan-sdk` step above writes `VULKAN_SDK=…` into
          # $env:GITHUB_ENV so it SHOULD be propagated here.  In
          # practice we've observed three failure modes on the
          # GitHub-hosted and custom D:\a pools:
          #
          #   1. The installer stage ran green but never actually
          #      produced Include/vulkan/vulkan_core.h / Lib/vulkan-1.lib
          #      (UAC denied, LunarG returned an HTML error page for
          #      the EXE URL, etc.) — the new setup-vulkan-sdk step now
          #      bails out at install time, but we still want a second
          #      line of defence at configure time in case the SDK step
          #      was skipped by some `if:` condition.
          #
          #   2. $env:VULKAN_SDK is populated but the value points to a
          #      directory that is not the SDK root (e.g. to
          #      `C:\VulkanSDK\1.3.280.0\` but the actual extracted
          #      tree lives one level deeper due to mirror ZIP layout).
          #
          #   3. The runner simply already has Vulkan headers & libs
          #      installed elsewhere – the Visual Studio 2026 "Desktop
          #      development with C++" workload ships vulkan-1.lib
          #      under the Windows SDK `um\x64\` directory and
          #      vulkan.h under `um\`, so FindVulkan.cmake should
          #      succeed without any LunarG installer.  But the empty
          #      string $env:VULKAN_SDK that we saw in the previous run
          #      breaks FindVulkan completely before any of that kicks
          #      in.
          #
          # So we do a FOUR-PASS VULKAN RESOLUTION here, analogous to
          # what we did for Visual Studio.  Acceptance criterion is
          # always the same — both files must exist:
          #
          #       * <root>\Include\vulkan\vulkan_core.h (or vulkan.h)
          #       * <root>\Lib\vulkan-1.lib               (or \Lib\x86_64\... on SDKs that use layout v2)
          #
          # or, for a Windows-SDK-style layout:
          #
          #       * <root>\Include\<ver>\um\vulkan.h
          #       * <root>\Lib\<ver>\um\x64\vulkan-1.lib
          #
          # When we find a valid pair, we set $env:VULKAN_SDK (for
          # logging), prepend the SDKs Bin folder to PATH, and EXPLICITLY
          # pass `-DVULKAN_SDK`, `-DVulkan_INCLUDE_DIR`, `-DVulkan_LIBRARY`
          # on the cmake command line so FindVulkan never has to do its
          # own discovery again.  Passing the three flags explicitly is
          # the only 100 % reliable way to defeat FindVulkan.cmake's
          # own vswhere / registry / VULKAN_SDK / CMAKE_PREFIX_PATH
          # cascade.  Without them, a blank or wrong VULKAN_SDK in the
          # environment still manages to poison FindVulkan even when we
          # "fixed" the env.
          # ------------------------------------------------------------------
          function Test-VulkanSdkLayout($root) {
            if ([string]::IsNullOrWhiteSpace($root)) { return $null }
            if (-not (Test-Path $root)) { return $null }
            # LunarG SDK layout.
            $headerCandidates = @(
              (Join-Path $root "Include\vulkan\vulkan_core.h"),
              (Join-Path $root "include\vulkan\vulkan_core.h"),
              (Join-Path $root "Include\vulkan\vulkan.h"),
              (Join-Path $root "include\vulkan\vulkan.h")
            )
            $libCandidates = @(
              (Join-Path $root "Lib\vulkan-1.lib"),
              (Join-Path $root "lib\vulkan-1.lib"),
              (Join-Path $root "Lib\x86_64\vulkan-1.lib"),
              (Join-Path $root "Lib\x64\vulkan-1.lib")
            )
            $header = $headerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            $lib    = $libCandidates    | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($header -and $lib) {
              return [PSCustomObject]@{
                IncludeDir = Split-Path (Split-Path $header -Parent) -Parent  # <root>\Include
                Library    = $lib
                BinDir     = Join-Path $root "Bin"
              }
            }
            return $null
          }
          function Test-WindowsSdkLayout($base) {
            if ([string]::IsNullOrWhiteSpace($base)) { return $null }
            if (-not (Test-Path $base)) { return $null }
            # Walk each versioned folder under the Windows SDK base.
            $versionDirs = Get-ChildItem -LiteralPath $base -Directory -ErrorAction SilentlyContinue |
                             Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                             Sort-Object Name -Descending
            foreach ($vd in $versionDirs) {
              $include = Join-Path $vd.FullName "Include\um\vulkan.h"
              $lib     = Join-Path $vd.FullName "Lib\x64\um\vulkan-1.lib"
              if ((Test-Path $include) -and (Test-Path $lib)) {
                return [PSCustomObject]@{
                  IncludeDir = (Join-Path $vd.FullName "Include\um")
                  Library    = $lib
                  BinDir     = $null
                }
              }
            }
            return $null
          }

          $vkSdk    = $null
          $vkSource = $null

          # PASS VK1 – trust the value of VULKAN_SDK propagated by the
          # setup-vulkan-sdk step.  The layout must pass the strict
          # structural check above; otherwise we silently ignore the env
          # value instead of handing FindVulkan an empty / wrong root.
          if (-not $vkSdk -and $env:VULKAN_SDK) {
            $hit = Test-VulkanSdkLayout $env:VULKAN_SDK
            if ($hit) {
              $vkSdk    = $hit
              $vkSource = "VK1(env:VULKAN_SDK=$($env:VULKAN_SDK))"
            } else {
              Write-Warning ("VK1: env:VULKAN_SDK='{0}' does not contain Include\vulkan\vulkan_core.h + Lib\vulkan-1.lib.  Ignoring and continuing to fallback passes." -f $env:VULKAN_SDK)
            }
          }

          # PASS VK2 – filesystem probe of common LunarG SDK install
          # locations (same technique as Visual Studio PASS 0).
          if (-not $vkSdk) {
            $vkProbeRoots = @(
              (Join-Path ${env:LOCALAPPDATA} "VulkanSDK"),
              "C:\VulkanSDK",
              "D:\VulkanSDK",
              "${env:ProgramFiles}\VulkanSDK",
              "${env:ProgramFiles(x86)}\VulkanSDK"
            )
            foreach ($folder in $vkProbeRoots) {
              if (-not (Test-Path $folder)) { continue }
              $hits = Get-ChildItem -LiteralPath $folder -Directory -ErrorAction SilentlyContinue |
                        ForEach-Object { Test-VulkanSdkLayout $_.FullName } |
                        Where-Object { $_ -ne $null } |
                        Select-Object -First 1
              if ($hits) {
                $vkSdk    = $hits
                $vkSource = "VK2(LunarG SDK folder at $folder)"
                break
              }
            }
          }

          # PASS VK3 – Windows SDK.  Look in both Program Files and
          # Program Files (x86) because VS 2022+ installers occasionally
          # put the kits in x86 even on x64 Windows.
          if (-not $vkSdk) {
            $sdkBases = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10",
              "${env:ProgramFiles}\Windows Kits\10",
              "${env:ProgramFiles(x86)}\Windows Kits\11",
              "${env:ProgramFiles}\Windows Kits\11"
            )
            foreach ($base in $sdkBases) {
              $hit = Test-WindowsSdkLayout $base
              if ($hit) {
                $vkSdk    = $hit
                $vkSource = "VK3(Windows SDK at $base)"
                break
              }
            }
          }

          # PASS VK4 – last-ditch depth-limited sweep of every fixed
          # drive, exactly like Visual Studio PASS 0.5.  We shortlist
          # folders named `Vulkan*`, `vulkan`, `VulkanSDK`, `VulkanSDK-*`,
          # or that are a `um` folder inside an Include/ tree (Windows
          # SDK marker), then verify the structural pair.  This is
          # glacially slow on D:\ (200 GB of build caches), so we only
          # run it on the workspace drive through the restricted
          # `Program Files` folders we used for VS PASS 0.5.
          if (-not $vkSdk) {
            Write-Warning "VK1/VK2/VK3 all missed.  Running VK4 depth-limited sweep (like VS PASS 0.5) …"
            $drives = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object -ExpandProperty DeviceID)
            $workspaceDrive = (Split-Path -Qualifier ($env:GITHUB_WORKSPACE ?? '')).ToLowerInvariant()
            :vkDriveLoop foreach ($drive in $drives) {
              $root = ($drive -replace ':$', ':\')
              if ($root.ToLowerInvariant() -eq $workspaceDrive) {
                $folders = @(
                  (Join-Path $root "Program Files (x86)"),
                  (Join-Path $root "Program Files"),
                  (Join-Path $root "VulkanSDK"),
                  (Join-Path $root "Vulkan")
                )
              } else {
                $folders = @($root)
              }
              foreach ($folder in $folders) {
                if (-not (Test-Path $folder)) { continue }
                Write-Host ("  VK4 scanning {0} -Depth 5" -f $folder)
                $markers = Get-ChildItem -LiteralPath $folder -Directory -Recurse -Depth 5 -ErrorAction SilentlyContinue |
                             Where-Object {
                               $_.Name -like 'Vulkan*' -or $_.Name -like 'vulkan*' -or
                               ($_.Name -eq 'um' -and ($_.Parent.Name -match '^\d+\.\d+\.\d+\.\d+$' -or $_.Parent.Parent.Name -eq 'Include'))
                             }
                foreach ($m in $markers) {
                  $candidates = @($m.FullName, (Split-Path $m.FullName -Parent), (Split-Path (Split-Path $m.FullName -Parent) -Parent))
                  foreach ($c in $candidates) {
                    $hit = Test-VulkanSdkLayout $c
                    if (-not $hit) { $hit = Test-WindowsSdkLayout $c }
                    if ($hit) {
                      $vkSdk    = $hit
                      $vkSource = "VK4(disk sweep near $($m.FullName))"
                      break vkDriveLoop
                    }
                  }
                }
              }
            }
          }

          # After all four passes – either tell the user exactly what
          # we found and where, or abort with a pointer to the exact
          # code paths they need to extend.  We never silently hand
          # FindVulkan a broken VULKAN_SDK environment variable.
          if (-not $vkSdk) {
            Write-Host "== VULKAN_SDK = $env:VULKAN_SDK"
            Write-Host "== PROGRAM FILES WINDOWS KITS tree dump (best effort) =="
            foreach ($base in @("${env:ProgramFiles(x86)}\Windows Kits\10","${env:ProgramFiles}\Windows Kits\10","${env:ProgramFiles(x86)}\Windows Kits\11","${env:ProgramFiles}\Windows Kits\11")) {
              if (Test-Path $base) {
                Write-Host ("  {0}\" -f $base)
                Get-ChildItem -LiteralPath $base -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("    {0}" -f $_.Name) }
              }
            }
            throw ("No Vulkan SDK or Windows SDK Vulkan copy could be located via any of VK1..VK4 passes.  Either the `setup-vulkan-sdk` step above failed silently (check its log for 403/404 or UAC warnings) — or the runner has a Vulkan install in a non-default folder that VK4's depth-5 sweep missed, in which case add the installation's top-level directory to the `$vkProbeRoots` array directly above this throw inside `.github/workflows/ci-windows.yml`.")
          }

          # Apply.
          $env:VULKAN_SDK = (Split-Path (Split-Path $vkSdk.IncludeDir -Parent) -Parent)
          if ($vkSdk.BinDir -and (Test-Path $vkSdk.BinDir)) {
            $env:PATH = "$($vkSdk.BinDir);$env:PATH"
          }
          Write-Host ("VULKAN RESOLVED via {0}:" -f $vkSource)
          Write-Host ("  VULKAN_SDK     (CMake root)  = {0}" -f $env:VULKAN_SDK)
          Write-Host ("  Vulkan_INCLUDE_DIR           = {0}" -f $vkSdk.IncludeDir)
          Write-Host ("  Vulkan_LIBRARY (x64)         = {0}" -f $vkSdk.Library)
          $cmakeDefs_Vulkan = @(
            "-DVULKAN_SDK=$($env:VULKAN_SDK)",
            "-DVulkan_INCLUDE_DIR=$($vkSdk.IncludeDir)",
            "-DVulkan_LIBRARY=$($vkSdk.Library)"
          )

          # ------------------------------------------------------------------
          # 5c. Resolve VKS3D_VER_PATCH from GITHUB_RUN_NUMBER safely.
          # ------------------------------------------------------------------
          $runNum = 0
          $rawRun = $env:GITHUB_RUN_NUMBER
          if ($rawRun -match '^\d+$') {
            $runNum = [int]$rawRun
          } else {
            Write-Warning "GITHUB_RUN_NUMBER='$rawRun' does not look like a non-negative integer; falling back to VKS3D_VER_PATCH=0."
          }
          $patchFlag = "-DVKS3D_VER_PATCH=$runNum"
          Write-Host "cmake define: $patchFlag"

          # ------------------------------------------------------------------
          # 5d. Actually invoke CMake — use pwsh splat so no CRLF
          #     artefact can sneak into the flag values.
          # ------------------------------------------------------------------
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-G', $generator,
            '-A', 'x64',
            $patchFlag
          ) + $cmakeDefs_Vulkan
          Write-Host "cmake configure args: $($cmakeArgs -join ' | ')"
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure exited $LASTEXITCODE"
          }

          # Extra sanity: verify the generated vcxproj really DOES
          # include image_blit.c (catches 100 % of STEREO_SOURCES /
          # stale-project bugs before we get to the 90-second link).
          $vcx = Join-Path (Resolve-Path build) "VKS3D_x64.vcxproj"
          if (-not (Test-Path $vcx)) { throw "$vcx was not generated" }
          $xml2 = Get-Content $vcx -Raw
          if ($xml2 -notmatch 'image_blit\.c') {
            throw "FATAL: VKS3D_x64.vcxproj does not reference src/image_blit.c.  Fix STEREO_SOURCES in CMakeLists.txt."
          }
          Write-Host "CMake configure OK — VKS3D_x64.vcxproj includes image_blit.c."

      # ------------------------------------------------------------------
      # 6. Build.  Release only (the shipping config).
      # ------------------------------------------------------------------
      - name: Build Release |x64|
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "cmake --build Release exited $LASTEXITCODE — search the log above for first `error C` or `error MSB` line"
          }
          $dll = Join-Path (Resolve-Path build) "Release\VKS3D_x64.dll"
          if (-not (Test-Path $dll)) { throw "Expected DLL missing after build: $dll" }
          $info = Get-Item $dll
          Write-Host ("Build SUCCESS: {0}  ({1:N0} bytes)" -f $dll.FullName, $info.Length)

      # ------------------------------------------------------------------
      # 7. Package artifacts (DLL + PDB + INI + LICENCES).
      # ------------------------------------------------------------------
      - name: Stage artifact
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $env:RUNNER_TEMP "VKS3D_x64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $src = Join-Path (Resolve-Path build) "Release"
          Copy-Item "$src\VKS3D_x64.dll"  $staging
          Copy-Item "$src\VKS3D_x64.pdb"  $staging -ErrorAction SilentlyContinue
          Copy-Item "vks3d.ini"           $staging -ErrorAction SilentlyContinue
          Copy-Item "LICENSE"             $staging -ErrorAction SilentlyContinue
          $artifactName = "VKS3D_x64-${{ github.sha }}"
          "artifact-name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Artifact: $artifactName  (staged at $staging)"
          Get-ChildItem $staging | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pkg.outputs.artifact-name }}
          path: ${{ runner.temp }}\VKS3D_x64
          retention-days: 30
          compression-level: 6
